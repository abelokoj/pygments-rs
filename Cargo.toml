[package]
name = "pygments-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Syntax highlighting with Pygments' lexers and styles, ported to Rust"
license = "BSD-2-Clause"
repository = "https://github.com/abelokoj/pygments-rs"
keywords = ["syntax-highlighting", "pygments", "lexer", "highlighter"]
categories = ["text-processing", "parser-implementations"]
include = ["/src", "/data", "/PYGMENTS_VERSION", "/LICENSE", "/README.md"]

[dependencies]
# Oniguruma's Python syntax mode matches Python `re` semantics closely.
# default-features = false skips bindgen (no libclang needed to build).
onig = { version = "6.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
